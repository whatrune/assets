<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>透過PNGテスト</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #2b2b2b;
      font-family: sans-serif;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1px;
      box-sizing: border-box;
    }

    img {
      display: block;
      max-width: 85%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="https://whatrune.github.io/assets/catcafe_menu.png" alt="Cat Cafe Menu">
  </div>
</body>
</html>
